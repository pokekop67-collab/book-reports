<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>外幣證照 互動題庫 · 11411 版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-soft: #555;
    --ink-light: #888;
    --paper: #f7f4ee;
    --paper-2: #efe9da;
    --line: #d8cdb6;
    --accent: #b8302a;
    --accent-soft: #fff3f1;
    --gold: #b08832;
    --teal: #2f6868;
    --green: #2c7a4b;
    --green-soft: #e8f5ec;
    --red: #c0392b;
    --red-soft: #fbe9e7;
    --blue: #1f3b5b;
    --warn: #fef0c4;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", -apple-system, sans-serif;
    line-height: 1.7;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Noto Serif TC", "Songti TC", serif; line-height: 1.3; }
  .mono { font-family: "JetBrains Mono", monospace; }
  button { font-family: inherit; cursor: pointer; }

  /* ===== App layout ===== */
  .app {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 24px 80px;
    min-height: 100vh;
  }
  header.top {
    padding: 28px 0 18px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 14px;
  }
  header.top h1 {
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header.top .v {
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.2em;
  }
  header.top .btn-home {
    font-size: 13px;
    background: transparent;
    border: 1px solid var(--ink);
    padding: 6px 14px;
    border-radius: 100px;
    color: var(--ink);
    transition: all 0.15s ease;
  }
  header.top .btn-home:hover { background: var(--ink); color: var(--paper); }

  /* ===== Screens ===== */
  .screen { display: none; animation: fadeIn 0.2s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ===== Home ===== */
  .hero {
    padding: 24px 0 32px;
    margin-bottom: 32px;
    border-bottom: 1px dashed var(--line);
  }
  .hero h2 {
    font-size: 42px;
    font-weight: 900;
    margin: 0 0 10px;
  }
  .hero .sub {
    font-size: 18px;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .stat {
    background: #fff;
    border: 1px solid var(--line);
    padding: 14px 18px;
    border-radius: 6px;
    text-align: center;
  }
  .stat .n {
    font-family: "Noto Serif TC", serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.1;
  }
  .stat .l {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    margin-top: 4px;
  }

  .mode-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .mode {
    background: #fff;
    border: 1px solid var(--line);
    padding: 22px 24px;
    border-radius: 8px;
    text-align: left;
    transition: all 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .mode:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(184, 48, 42, 0.1);
  }
  .mode .ico {
    font-size: 24px;
    margin-bottom: 4px;
  }
  .mode .title {
    font-size: 18px;
    font-weight: 700;
    font-family: "Noto Serif TC", serif;
  }
  .mode .desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .mode .meta {
    font-size: 12px;
    color: var(--ink-light);
    margin-top: 6px;
    letter-spacing: 0.05em;
  }

  /* ===== Chapter picker ===== */
  .chapter-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin: 20px 0;
  }
  .chapter-btn {
    background: #fff;
    border: 1px solid var(--line);
    padding: 16px 20px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    width: 100%;
  }
  .chapter-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .chapter-btn .ch-n {
    font-family: "Noto Serif TC", serif;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.15em;
    min-width: 60px;
  }
  .chapter-btn .ch-t { flex: 1; font-weight: 500; }
  .chapter-btn .ch-c {
    font-family: "JetBrains Mono", monospace;
    color: var(--ink-soft);
    font-size: 13px;
    background: var(--paper);
    padding: 2px 10px;
    border-radius: 100px;
  }

  /* ===== Quiz screen ===== */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    gap: 12px;
    flex-wrap: wrap;
  }
  .progress {
    flex: 1;
    height: 6px;
    background: var(--paper-2);
    border-radius: 100px;
    overflow: hidden;
    min-width: 200px;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }
  .quiz-stats {
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    color: var(--ink-soft);
    display: flex;
    gap: 14px;
  }
  .quiz-stats .ok { color: var(--green); }
  .quiz-stats .ng { color: var(--red); }

  .timer {
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    font-weight: 700;
    padding: 4px 12px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 4px;
  }
  .timer.warn { background: var(--accent); }

  .question {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 24px 28px;
    margin-bottom: 18px;
  }
  .question .qid {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 0.1em;
  }
  .question .qid .star { color: var(--gold); margin-left: 4px; }
  .question .qtext {
    font-size: 17px;
    line-height: 1.85;
    margin-bottom: 22px;
    font-weight: 500;
    white-space: pre-wrap;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    background: var(--paper);
    border: 1.5px solid var(--line);
    padding: 12px 16px 12px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.12s ease;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    line-height: 1.6;
    text-align: left;
  }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt .num {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    border: 1.5px solid var(--line);
    color: var(--ink-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }
  .opt .body { flex: 1; }
  .opt.selected { border-color: var(--accent); background: var(--accent-soft); }
  .opt.selected .num { background: var(--accent); color: #fff; border-color: var(--accent); }
  .opt.correct {
    border-color: var(--green);
    background: var(--green-soft);
  }
  .opt.correct .num { background: var(--green); color: #fff; border-color: var(--green); }
  .opt.wrong {
    border-color: var(--red);
    background: var(--red-soft);
  }
  .opt.wrong .num { background: var(--red); color: #fff; border-color: var(--red); }
  .opt[disabled] { cursor: default; }
  .opt[disabled]:not(.correct):not(.wrong):not(.selected) { opacity: 0.55; }

  .feedback {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 6px;
    font-size: 14.5px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: var(--green-soft); color: var(--green); border-left: 4px solid var(--green); }
  .feedback.wrong { background: var(--red-soft); color: var(--red); border-left: 4px solid var(--red); }
  .feedback strong { font-weight: 700; }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 14.5px;
    font-weight: 500;
    transition: all 0.15s ease;
    letter-spacing: 0.03em;
  }
  .btn:hover { background: var(--accent); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--ink);
  }
  .btn.ghost:hover { background: var(--ink); color: var(--paper); }
  .btn.danger { background: var(--accent); }
  .btn.flag {
    background: #fef4d6;
    color: var(--gold);
    border: 1px solid var(--gold);
  }
  .btn.flag.flagged { background: var(--gold); color: #fff; }

  /* ===== Results ===== */
  .result-card {
    text-align: center;
    padding: 40px 30px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin: 20px 0;
  }
  .result-card .score {
    font-family: "Noto Serif TC", serif;
    font-size: 80px;
    font-weight: 900;
    line-height: 1;
    margin: 10px 0;
  }
  .result-card .score.pass { color: var(--green); }
  .result-card .score.fail { color: var(--accent); }
  .result-card .verdict {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .result-card .breakdown {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin: 20px 0 8px;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .result-card .breakdown strong { color: var(--ink); font-size: 16px; }

  .review-list { margin-top: 24px; }
  .review-list .qrow {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 4px solid var(--red);
    padding: 14px 18px;
    border-radius: 6px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .review-list .qrow:hover { transform: translateX(2px); }
  .review-list .qrow.ok { border-left-color: var(--green); }
  .review-list .qrow .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .review-list .qrow .body { font-size: 14px; line-height: 1.5; }
  .review-list .qrow .ans {
    font-size: 13px;
    margin-top: 6px;
    color: var(--ink-soft);
  }
  .review-list .qrow .ans .your { color: var(--red); font-weight: 600; }
  .review-list .qrow.ok .ans .your { color: var(--green); }
  .review-list .qrow .ans .right { color: var(--green); font-weight: 600; margin-left: 8px; }

  /* ===== Empty / loading ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }

  /* ===== Footer ===== */
  footer.bottom {
    border-top: 1px solid var(--line);
    margin-top: 60px;
    padding-top: 20px;
    font-size: 12.5px;
    color: var(--ink-light);
    text-align: center;
  }

  /* ===== Mobile ===== */
  @media (max-width: 720px) {
    .app { padding: 0 16px 60px; }
    .hero h2 { font-size: 32px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .mode-grid { grid-template-columns: 1fr; }
    .question { padding: 18px; }
    .question .qtext { font-size: 15.5px; }
    .quiz-header { flex-direction: column; align-items: stretch; }
    .progress { min-width: 100%; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="top">
    <div>
      <h1>外幣證照 互動題庫</h1>
      <span class="v">11411 版 · 694 題</span>
    </div>
    <button class="btn-home" onclick="goHome()">← 回首頁</button>
  </header>

  <!-- ===== HOME SCREEN ===== -->
  <section class="screen active" id="screen-home">
    <div class="hero">
      <h2>外幣保險證照<br/>考前題庫練習</h2>
      <p class="sub">人身保險業務員銷售外幣收付非投資型保險商品</p>
      <div class="stats">
        <div class="stat"><div class="n">694</div><div class="l">總題數</div></div>
        <div class="stat"><div class="n" id="stat-starred">—</div><div class="l">重點題</div></div>
        <div class="stat"><div class="n">5</div><div class="l">章節</div></div>
        <div class="stat"><div class="n" id="stat-history">0</div><div class="l">已練習</div></div>
      </div>
    </div>

    <h3 style="font-size:20px;margin:8px 0 14px;">選擇模式</h3>
    <div class="mode-grid">
      <button class="mode" onclick="showChapters()">
        <div class="ico">📖</div>
        <div class="title">章節練習</div>
        <div class="desc">依章節順序練習，適合系統性複習</div>
        <div class="meta">5 個章節可選</div>
      </button>
      <button class="mode" onclick="startQuiz({mode:'starred'})">
        <div class="ico">⭐</div>
        <div class="title">重點題練習</div>
        <div class="desc">只練作者標 ⭐ 的重點題，考前衝刺最有效</div>
        <div class="meta" id="meta-starred">—</div>
      </button>
      <button class="mode" onclick="startQuiz({mode:'random', limit:30})">
        <div class="ico">🎲</div>
        <div class="title">隨機練習</div>
        <div class="desc">從全題庫隨機抽 30 題，每次不一樣</div>
        <div class="meta">30 題 · 不限時</div>
      </button>
      <button class="mode" onclick="startQuiz({mode:'exam'})">
        <div class="ico">🎯</div>
        <div class="title">模擬考</div>
        <div class="desc">隨機 50 題、60 分鐘倒數計時、70 分合格</div>
        <div class="meta">擬真考試環境</div>
      </button>
      <button class="mode" onclick="startQuiz({mode:'wrong'})">
        <div class="ico">📝</div>
        <div class="title">錯題本</div>
        <div class="desc">複習你之前答錯的題目（自動記錄）</div>
        <div class="meta" id="meta-wrong">—</div>
      </button>
      <button class="mode" onclick="startQuiz({mode:'flagged'})">
        <div class="ico">🚩</div>
        <div class="title">標記題複習</div>
        <div class="desc">你按過旗標的題目（不會的、重要的）</div>
        <div class="meta" id="meta-flagged">—</div>
      </button>
    </div>

    <div style="margin-top:30px;padding-top:24px;border-top:1px dashed var(--line);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn ghost" onclick="resetWrong()" title="清除錯題本">清除錯題本</button>
      <button class="btn ghost" onclick="resetFlagged()" title="清除旗標">清除旗標</button>
      <button class="btn ghost" onclick="resetAll()" title="清除全部紀錄">清除全部</button>
    </div>
  </section>

  <!-- ===== CHAPTERS SCREEN ===== -->
  <section class="screen" id="screen-chapters">
    <h2 style="font-size:28px;margin:8px 0 6px;">章節練習</h2>
    <p style="color:var(--ink-soft);margin-top:0;">點選章節開始練習。會以章節內順序出題。</p>
    <div class="chapter-list" id="chapter-list"></div>
  </section>

  <!-- ===== QUIZ SCREEN ===== -->
  <section class="screen" id="screen-quiz">
    <div class="quiz-header">
      <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="quiz-stats">
        <span id="q-counter">0 / 0</span>
        <span class="ok">✓ <span id="q-ok">0</span></span>
        <span class="ng">✗ <span id="q-ng">0</span></span>
      </div>
      <div class="timer" id="timer" style="display:none;">60:00</div>
    </div>

    <div class="question" id="q-card">
      <div class="qid" id="qid"></div>
      <div class="qtext" id="qtext"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="actions">
      <button class="btn ghost" onclick="toggleFlag()" id="btn-flag">🚩 標記</button>
      <button class="btn" onclick="nextQuestion()" id="btn-next" disabled>下一題 →</button>
    </div>
    <div style="margin-top:14px;text-align:center;">
      <button class="btn ghost" onclick="endQuiz()" style="font-size:13px;">提前結束</button>
    </div>
  </section>

  <!-- ===== RESULT SCREEN ===== -->
  <section class="screen" id="screen-result">
    <div class="result-card">
      <div class="verdict" id="r-verdict"></div>
      <div class="score" id="r-score"></div>
      <div class="breakdown">
        <div><strong id="r-correct">0</strong> 答對</div>
        <div><strong id="r-wrong">0</strong> 答錯</div>
        <div><strong id="r-total">0</strong> 總題</div>
        <div id="r-time-box" style="display:none;"><strong id="r-time">—</strong> 用時</div>
      </div>
    </div>

    <h3 style="font-size:18px;margin:30px 0 14px;">作答回顧</h3>
    <div class="review-list" id="review-list"></div>

    <div style="display:flex;gap:12px;justify-content:center;margin-top:30px;">
      <button class="btn" onclick="goHome()">回首頁</button>
      <button class="btn ghost" onclick="retryQuiz()">再考一次</button>
    </div>
  </section>

  <footer class="bottom">
    <p>題庫來源：JY 價值筆記《外幣證照精選題庫》11411 版（694 題）<br/>
    答題紀錄存於瀏覽器本機（localStorage），不會上傳。</p>
  </footer>
</div>

<script>
const QUESTIONS = JSON.parse(document.getElementById('qbank').textContent);
const CHAPTERS = {
  1: "第一章 緒論",
  2: "第二章 以外幣收付之人身保險業務概論",
  3: "第三章 以外幣收付之非投資型人身保險業務規範",
  4: "第四章 銷售應注意事項",
  5: "第五章 以外幣收付之人身保險業務相關法規"
};

// ===== State =====
let state = {
  questions: [],
  idx: 0,
  answered: [],
  correct: 0,
  mode: '',
  timerInterval: null,
  timerEnd: null,
  startedAt: null
};

// ===== Storage =====
const LS = {
  wrong: 'vc_wrong_v1',
  flagged: 'vc_flag_v1',
  history: 'vc_hist_v1'
};
function getSet(key) {
  try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
  catch (e) { return new Set(); }
}
function saveSet(key, set) {
  localStorage.setItem(key, JSON.stringify([...set]));
}
function getHistory() {
  try { return JSON.parse(localStorage.getItem(LS.history) || '0'); }
  catch (e) { return 0; }
}
function incHistory() {
  const n = getHistory() + 1;
  localStorage.setItem(LS.history, JSON.stringify(n));
}

// ===== Init =====
function init() {
  const starred = QUESTIONS.filter(q => q.s === 1).length;
  document.getElementById('stat-starred').textContent = starred;
  document.getElementById('meta-starred').textContent = `${starred} 題 · 不限時`;

  const wrongSet = getSet(LS.wrong);
  document.getElementById('meta-wrong').textContent = wrongSet.size === 0 ? '尚無錯題' : `${wrongSet.size} 題 · 不限時`;

  const flagSet = getSet(LS.flagged);
  document.getElementById('meta-flagged').textContent = flagSet.size === 0 ? '尚無標記' : `${flagSet.size} 題 · 不限時`;

  document.getElementById('stat-history').textContent = getHistory();

  // Build chapter list
  const chList = document.getElementById('chapter-list');
  chList.innerHTML = '';
  for (const [num, name] of Object.entries(CHAPTERS)) {
    const count = QUESTIONS.filter(q => q.c === Number(num)).length;
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.innerHTML = `
      <div class="ch-n">CHAPTER ${String(num).padStart(2,'0')}</div>
      <div class="ch-t">${name.replace(/^第..章\s*/, '')}</div>
      <div class="ch-c">${count} 題</div>`;
    btn.onclick = () => startQuiz({mode:'chapter', chapter: Number(num)});
    chList.appendChild(btn);
  }
}

// ===== Navigation =====
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function goHome() {
  stopTimer();
  init();
  show('screen-home');
}
function showChapters() {
  show('screen-chapters');
}

// ===== Start quiz =====
function startQuiz(opts) {
  const wrongSet = getSet(LS.wrong);
  const flagSet = getSet(LS.flagged);
  let pool;
  let isExam = false;

  if (opts.mode === 'chapter') {
    pool = QUESTIONS.filter(q => q.c === opts.chapter);
  } else if (opts.mode === 'starred') {
    pool = QUESTIONS.filter(q => q.s === 1);
  } else if (opts.mode === 'random') {
    pool = shuffle([...QUESTIONS]).slice(0, opts.limit || 30);
  } else if (opts.mode === 'exam') {
    pool = shuffle([...QUESTIONS]).slice(0, 50);
    isExam = true;
  } else if (opts.mode === 'wrong') {
    pool = QUESTIONS.filter(q => wrongSet.has(q.i));
  } else if (opts.mode === 'flagged') {
    pool = QUESTIONS.filter(q => flagSet.has(q.i));
  }

  if (!pool || pool.length === 0) {
    alert('此模式目前沒有題目可練習');
    return;
  }

  state = {
    questions: pool,
    idx: 0,
    answered: new Array(pool.length).fill(null),
    correct: 0,
    mode: opts.mode,
    isExam,
    startedAt: Date.now(),
    chapter: opts.chapter
  };

  document.getElementById('timer').style.display = isExam ? 'block' : 'none';
  if (isExam) {
    state.timerEnd = Date.now() + 60 * 60 * 1000;
    startTimer();
  }

  show('screen-quiz');
  renderQuestion();
}

function renderQuestion() {
  const q = state.questions[state.idx];
  const flagSet = getSet(LS.flagged);

  // Header
  document.getElementById('q-counter').textContent = `${state.idx + 1} / ${state.questions.length}`;
  document.getElementById('q-ok').textContent = state.correct;
  document.getElementById('q-ng').textContent = state.answered.filter((a, i) => a !== null && a !== state.questions[i].a).length;
  document.getElementById('progress-bar').style.width = `${(state.idx / state.questions.length) * 100}%`;

  // Question
  const chName = CHAPTERS[q.c].replace(/^第..章\s*/, '');
  document.getElementById('qid').innerHTML = `題 #${q.i} · <span style="color:var(--ink-light);">${chName}</span>` + (q.s === 1 ? ' <span class="star">⭐</span>' : '');
  document.getElementById('qtext').textContent = q.q;

  // Options
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  q.o.forEach((opt, idx) => {
    const num = idx + 1;
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.dataset.num = num;
    btn.innerHTML = `<div class="num">${num}</div><div class="body">${escapeHtml(opt)}</div>`;
    btn.onclick = () => selectOption(num);
    opts.appendChild(btn);
  });

  // Feedback
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';

  // Flag button
  const flagBtn = document.getElementById('btn-flag');
  if (flagSet.has(q.i)) flagBtn.classList.add('flagged');
  else flagBtn.classList.remove('flagged');

  document.getElementById('btn-next').disabled = true;

  // Restore prior answer (if going back)
  const prior = state.answered[state.idx];
  if (prior !== null) {
    revealAnswer(prior);
  }
}

function selectOption(num) {
  if (state.answered[state.idx] !== null) return;
  state.answered[state.idx] = num;
  const q = state.questions[state.idx];
  const isCorrect = num === q.a;
  if (isCorrect) state.correct++;
  else recordWrong(q.i);

  revealAnswer(num);
}

function revealAnswer(picked) {
  const q = state.questions[state.idx];
  const isCorrect = picked === q.a;
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o => {
    const n = Number(o.dataset.num);
    o.disabled = true;
    o.onclick = null;
    if (n === q.a) o.classList.add('correct');
    if (n === picked && !isCorrect) o.classList.add('wrong');
    if (n === picked) o.classList.add('selected');
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
  fb.innerHTML = isCorrect
    ? `<strong>✓ 答對了！</strong>　正確答案是 ${q.a}`
    : `<strong>✗ 答錯了</strong>　你選的是 ${picked}，正確答案是 ${q.a}`;

  // Update counters
  document.getElementById('q-ok').textContent = state.correct;
  document.getElementById('q-ng').textContent = state.answered.filter((a, i) => a !== null && a !== state.questions[i].a).length;
  document.getElementById('progress-bar').style.width = `${((state.idx + 1) / state.questions.length) * 100}%`;

  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
  if (state.idx + 1 >= state.questions.length) {
    endQuiz();
    return;
  }
  state.idx++;
  renderQuestion();
}

function toggleFlag() {
  const q = state.questions[state.idx];
  const set = getSet(LS.flagged);
  if (set.has(q.i)) set.delete(q.i);
  else set.add(q.i);
  saveSet(LS.flagged, set);
  document.getElementById('btn-flag').classList.toggle('flagged');
}

function recordWrong(qid) {
  const set = getSet(LS.wrong);
  set.add(qid);
  saveSet(LS.wrong, set);
}

function endQuiz() {
  stopTimer();
  incHistory();
  const total = state.questions.length;
  const correct = state.correct;
  const wrong = state.answered.filter((a, i) => a !== null && a !== state.questions[i].a).length;
  const unanswered = total - correct - wrong;
  const scorePct = Math.round((correct / total) * 100);
  const pass = scorePct >= 70;

  document.getElementById('r-verdict').textContent = pass ? '🎉 合格！' : '差一點，再加油';
  const scoreEl = document.getElementById('r-score');
  scoreEl.textContent = scorePct;
  scoreEl.className = 'score ' + (pass ? 'pass' : 'fail');
  document.getElementById('r-correct').textContent = correct;
  document.getElementById('r-wrong').textContent = wrong + unanswered;
  document.getElementById('r-total').textContent = total;

  if (state.isExam) {
    const ms = Date.now() - state.startedAt;
    const min = Math.floor(ms / 60000);
    const sec = Math.floor((ms % 60000) / 1000);
    document.getElementById('r-time').textContent = `${min}:${String(sec).padStart(2,'0')}`;
    document.getElementById('r-time-box').style.display = 'block';
  } else {
    document.getElementById('r-time-box').style.display = 'none';
  }

  // Review list
  const list = document.getElementById('review-list');
  list.innerHTML = '';
  state.questions.forEach((q, i) => {
    const ans = state.answered[i];
    const ok = ans === q.a;
    const row = document.createElement('div');
    row.className = 'qrow' + (ok ? ' ok' : '');
    row.innerHTML = `
      <div class="head">
        <span>題 #${q.i} · ${CHAPTERS[q.c].replace(/^第..章\s*/, '')}${q.s === 1 ? ' ⭐' : ''}</span>
        <span>${ok ? '✓' : '✗'}</span>
      </div>
      <div class="body">${escapeHtml(q.q)}</div>
      <div class="ans">
        ${ans !== null ? `你的答案：<span class="your">${ans}. ${escapeHtml(q.o[ans-1] || '')}</span>` : '<span class="your">未作答</span>'}
        <span class="right">正解：${q.a}. ${escapeHtml(q.o[q.a-1] || '')}</span>
      </div>`;
    list.appendChild(row);
  });

  show('screen-result');
}

function retryQuiz() {
  startQuiz({mode: state.mode, chapter: state.chapter});
}

// ===== Timer =====
function startTimer() {
  updateTimer();
  state.timerInterval = setInterval(updateTimer, 1000);
}
function updateTimer() {
  const remain = state.timerEnd - Date.now();
  const el = document.getElementById('timer');
  if (remain <= 0) {
    el.textContent = '0:00';
    endQuiz();
    return;
  }
  const min = Math.floor(remain / 60000);
  const sec = Math.floor((remain % 60000) / 1000);
  el.textContent = `${min}:${String(sec).padStart(2,'0')}`;
  if (remain < 5 * 60 * 1000) el.classList.add('warn');
}
function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

// ===== Reset =====
function resetWrong() {
  if (!confirm('確定清除錯題本？')) return;
  localStorage.removeItem(LS.wrong);
  init();
}
function resetFlagged() {
  if (!confirm('確定清除所有標記？')) return;
  localStorage.removeItem(LS.flagged);
  init();
}
function resetAll() {
  if (!confirm('確定清除所有紀錄（錯題、標記、練習次數）？')) return;
  localStorage.removeItem(LS.wrong);
  localStorage.removeItem(LS.flagged);
  localStorage.removeItem(LS.history);
  init();
}

// ===== Utils =====
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>
</body>
</html>
